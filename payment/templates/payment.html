<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Page</title>
</head>
<body>
    <h1>Payment Page</h1>
    <form action="{% url 'confirm_payment' %}" method="POST" id="razorpay-form">
        {% csrf_token %}
        <input type="hidden" name="razorpay_order_id" id="razorpay_order_id">
        <input type="hidden" name="razorpay_payment_id" id="razorpay_payment_id">
        <input type="hidden" name="razorpay_signature" id="razorpay_signature">
        <button type="button" id="pay-button">Pay Now</button> <!-- Changed type to button -->
    </form>

    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <script>
        var options = {
            "key": "{{Key}}", // Replace with your Razorpay key ID
            "amount": "{{amount}}", // Amount in paise (for example, ₹500)
            "currency": "INR",
            "name": "Your Company Name",
            "description": "Test Transaction",
            "image": "https://example.com/your_logo", // Replace with your logo URL
            "order_id": "{{order_id}}", // Replace with the actual order ID
            "handler": function (response) {
                // Set the values in the form
                document.getElementById('razorpay_payment_id').value = response.razorpay_payment_id;
                document.getElementById('razorpay_order_id').value = response.razorpay_order_id;
                document.getElementById('razorpay_signature').value = response.razorpay_signature;
                // Submit the form
                document.getElementById('razorpay-form').submit();
            },
            "prefill": {
                "name": "John Doe",
                "email": "john.doe@example.com",
                "contact": "9400942178"
            },
            "notes": {
                "address": "Some address"
            },
            "theme": {
                "color": "#F37254"
            }
        };

        var rzp1 = new Razorpay(options);
        // Listening for the button click to open Razorpay
        document.getElementById('pay-button').onclick = function(e) {
            rzp1.open();
            e.preventDefault(); // Prevent default form submission
        }
    </script>
</body>
</html>
